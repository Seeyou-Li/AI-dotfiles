name: Main Config
version: 1.0.0
schema: v1

# 对话模型
models:
  - name: DeepSeek V4 Flash
    provider: openai
    model: deepseek-v4-flash
    apiBase: https://api.deepseek.com/v1
    apiKey: YOUR_DEEPSEEK_API_KEY
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      temperature: 0.0
      maxTokens: 4096

# 独立 Tab 自动补全模型
tabAutocompleteModel:
  name: DeepSeek 补全
  provider: openai
  model: deepseek-v4-flash
  apiBase: https://api.deepseek.com/v1
  apiKey: YOUR_DEEPSEEK_API_KEY
  useLegacyCompletionsEndpoint: false
  contextLength: 8192
  completionOptions:
    maxTokens: 256
    temperature: 0.0
    topP: 1
    presencePenalty: 0
    frequencyPenalty: 0

# 上下文提供方
context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder

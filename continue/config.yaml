name: Main Config
version: 1.0.0
schema: v1

models:
  # 对话模型
  - name: DeepSeek V4 Flash
    provider: openai
    model: deepseek-v4-flash
    apiBase: https://api.deepseek.com/v1
    apiKey: YOUR_DEEPSEEK_API_KEY
    roles:
      - chat
      - edit
      - apply

  # Tab 自动补全模型（beta 端点支持 FIM）
  - name: DeepSeek 补全
    provider: openai
    model: deepseek-v4-flash
    apiBase: https://api.deepseek.com/beta
    apiKey: YOUR_DEEPSEEK_API_KEY
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 1024
      modelTimeout: 150
      maxSuffixPercentage: 0.2
      prefixPercentage: 0.3

context:
  - provider: code
  - provider: docs
  - provider: diff
  - provider: terminal
  - provider: problems
  - provider: folder
